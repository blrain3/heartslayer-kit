name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Python compile
        run: python3 -m compileall -q scripts tools
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh
